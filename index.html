<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSVDDS0210</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #15151d;
    --border: rgba(255, 255, 255, .14);
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --white: #ffffff;
    --spotify: #1db954;
    --youtube: #ff0033;
    --guns: #a855f7;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ===== Intro: blur inicial y nombre central ===== */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 11, 16, .55);
    pointer-events: none;
    animation: introFade 1.2s ease 2.1s forwards;
  }
  .intro h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--white);
    animation: introName 1.4s ease .2s both, introNameOut 1s ease 2.1s forwards;
  }
  @keyframes introName {
    from { opacity: 0; filter: blur(12px); }
    to   { opacity: 1; filter: blur(0); }
  }
  @keyframes introNameOut {
    from { opacity: 1; filter: blur(0); }
    to   { opacity: 0; filter: blur(10px); }
  }
  @keyframes introFade {
    0%   { opacity: 1; visibility: visible; }
    99%  { opacity: 0; visibility: visible; }
    100% { opacity: 0; visibility: hidden; }
  }

  /* Blur del contenido que se quita al terminar la intro */
  .content, .bg-eyes {
    animation: unblur 1.6s ease 2.1s forwards;
  }
  .content { filter: blur(14px); }
  .bg-eyes { filter: blur(14px); }
  @keyframes unblur {
    from { filter: blur(14px); }
    to   { filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .intro, .intro h1, .content, .bg-eyes { animation: none; }
    .intro { display: none; }
    .content, .bg-eyes { filter: none; }
  }

  /* ===== Fondo animado de ojos ===== */
  .bg-eyes {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .eye {
    position: absolute;
    bottom: -20vh;
    animation-name: rise;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0;
  }
  .eye svg {
    display: block;
    width: 100%;
    height: auto;
    animation-name: blink;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    transform-origin: center;
  }
  @keyframes rise {
    0%   { transform: translateY(0);      opacity: 0; }
    10%  { opacity: .22; }
    85%  { opacity: .22; }
    100% { transform: translateY(-125vh); opacity: 0; }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .eye, .eye svg { animation: none; }
    .eye { display: none; }
  }

  /* ===== Contenido por encima del fondo ===== */
  .content { position: relative; z-index: 1; }

  .banner {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #1a1a24, #0b0b10 70%);
    border-bottom: 2px solid var(--white);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  .sidebar { text-align: center; }
  .pfp {
    width: 176px;
    height: 176px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--white);
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
    background: var(--panel);
    margin-top: -88px;
    position: relative;
  }

  /* Nombre con efecto cromático animado */
  .name {
    margin: 16px 0 6px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: .08em;
    background: linear-gradient(90deg, #6b6b75 0%, #ffffff 25%, #6b6b75 50%, #ffffff 75%, #6b6b75 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: chroma 4s linear infinite;
  }
  @keyframes chroma {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .name { animation: none; }
  }

  .bio-box {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px 18px;
    text-align: left;
  }
  .bio-box p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }

  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.07); }
  .btn img, .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-spotify:hover { border-color: var(--spotify); }
  .btn-yt img { filter: brightness(0) invert(1); }
  .btn-yt:hover { border-color: var(--youtube); }
  .btn-guns svg { color: var(--guns); }
  .btn-guns:hover { border-color: var(--guns); }

  .main { min-width: 0; padding-top: 24px; }
  .section-title {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* Barra de desplazamiento de álbumes en negro */
  .albums {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 4px 2px 14px;
    scrollbar-width: thin;
    scrollbar-color: #000 #000;
  }
  .albums::-webkit-scrollbar { height: 10px; }
  .albums::-webkit-scrollbar-track { background: #000; }
  .albums::-webkit-scrollbar-thumb { background: #000; border-radius: 6px; }
  .albums::-webkit-scrollbar-thumb:hover { background: #111; }

  .album {
    flex: 0 0 160px;
    text-decoration: none;
    color: var(--text);
    transition: transform .2s ease;
  }
  .album:hover { transform: translateY(-4px); }
  .album img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    margin-bottom: 10px;
  }
  .album span {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .video-wrap {
    margin-top: 28px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 16px; }
    .sidebar { max-width: 360px; width: 100%; margin: 0 auto; }
    .pfp { margin: -88px auto 0; display: block; }
    .main { padding-top: 0; }
  }
</style>
</head>
<body>

<!-- Intro: nombre en blanco al centro, que se desvanece al cargar -->
<div class="intro" aria-hidden="true">
  <h1>MSVDDS0210</h1>
</div>

<!-- Fondo: ojos que suben y parpadean -->
<div class="bg-eyes" id="bgEyes" aria-hidden="true"></div>

<div class="content">

  <img class="banner" src="assets/profile/banner.png" alt="Banner de MSVDDS0210">

  <div class="layout">

    <aside class="sidebar">
      <img class="pfp" src="assets/profile/pfp.png" alt="MSVDDS0210">
      <h1 class="name">MSVDDS0210</h1>

      <div class="bio-box">
        <p>Yea...</p>

        <a class="btn btn-spotify" href="https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" target="_blank" rel="noopener">
          <img src="https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/spotify.svg" alt="">

        </a>

          YouTube
        </a>

        <a class="btn btn-guns" href="https://guns.lol/miyomusic" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>

    <main class="main">

        <a class="album" href="https://open.spotify.com/album/2fWjp4PamyxCGsBqWQs8dc" target="_blank" rel="noopener">

      </div>

      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/QmiBnhzJtH4"
          title="Video destacado de MSVDDS0210"

          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
    </main>

  </div>
</div>

<script>
  // Genera los ojos del fondo con tamaños, posiciones y velocidades distintas
  const EYE_SVG = `
    <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 30 Q50 -14 97 30 Q50 74 3 30 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="50" cy="30" r="15" fill="#fff"/>
    </svg>`;

  const container = document.getElementById("bgEyes");
  const COUNT = 18;

  for (let i = 0; i < COUNT; i++) {
    const eye = document.createElement("div");
    eye.className = "eye";
    eye.innerHTML = EYE_SVG;

    const width = 60 + Math.random() * 90;
    const left = Math.random() * 100;
    const riseSeconds = 16 + Math.random() * 18;
    const riseDelay = -Math.random() * riseSeconds;
    const blinkSeconds = 3 + Math.random() * 4;
    const blinkDelay = -Math.random() * blinkSeconds;

    eye.style.width = width + "px";
    eye.style.left = left + "%";
    eye.style.animationDuration = riseSeconds + "s";
    eye.style.animationDelay = riseDelay + "s";

    const svg = eye.querySelector("svg");
    svg.style.animationDuration = blinkSeconds + "s";
    svg.style.animationDelay = blinkDelay + "s";

    container.appendChild(eye);
  }
</script>

</body>
</html>
