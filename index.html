<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Msvdds0210</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f0f14; color: #eee;
         display: flex; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 480px; text-align: center; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #7c5cff; }
  h1 { margin: 12px 0 4px; }
  .bio { color: #aaa; font-size: .95rem; }
  .links a { display: inline-block; margin: 6px; padding: 8px 14px; border-radius: 999px;
             background: #1d1d27; color: #fff; text-decoration: none; }
  h2 { text-align: left; font-size: 1.1rem; margin-top: 32px; }
  iframe { border-radius: 12px; }
  .destacado iframe { width: 100%; height: 315px; border: 0; border-radius: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .grid a { color: #eee; text-decoration: none; font-size: .85rem; }
  .grid img { width: 100%; border-radius: 8px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <img class="avatar" src="assets/images/avatar.jpg" alt="Msvdds0210">
  <h1>Msvdds0210</h1>
  <p class="bio">Artista de música. Escucha lo último aquí.</p>

  <div class="links">
    <a href="https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" target="_blank">Spotify</a>
    <a href="https://www.youtube.com/channel/UCCwK9XKbU0bPLVUey64PcEA" target="_blank">YouTube</a>
  </div>

  <h2>Escucha</h2>
  <iframe data-testid="embed-iframe" style="border-radius:12px"
    src="https://open.spotify.com/embed/artist/0okmlAaeb1l5d1gqOeTsSJ?utm_source=generator"
    width="100%" height="352" frameBorder="0" allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"></iframe>

  <div id="destacado-wrap" class="destacado" hidden>
    <h2>Destacado</h2>
    <iframe id="destacado" loading="lazy" allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
  </div>

  <h2>Últimos videos</h2>
  <div id="videos" class="grid">Cargando...</div>
</div>

<script>
  // Pon aquí el ID de un video para destacarlo arriba (la parte después de "v=" en la URL).
  // Déjalo vacío ("") si no quieres destacado.
  const FEATURED_VIDEO_ID = "";

  if (FEATURED_VIDEO_ID) {
    const wrap = document.getElementById("destacado-wrap");
    document.getElementById("destacado").src = `https://www.youtube.com/embed/${FEATURED_VIDEO_ID}`;
    wrap.hidden = false;
  }

  async function cargarVideos() {
    const res = await fetch("assets/feed.xml");
    if (!res.ok) throw new Error("No se encontró el feed");
    const xml = new DOMParser().parseFromString(await res.text(), "application/xml");
    const YT = "http://www.youtube.com/xml/schemas/2015";
    const entries = [...xml.getElementsByTagName("entry")];

    const cont = document.getElementById("videos");
    cont.innerHTML = "";
    for (const entry of entries) {
      const id = entry.getElementsByTagNameNS(YT, "videoId")[0].textContent;
      const title = entry.getElementsByTagName("title")[0].textContent;
      const a = document.createElement("a");
      a.href = `https://www.youtube.com/watch?v=${id}`;
      a.target = "_blank";
      const img = document.createElement("img");
      img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
      img.alt = "";
      a.appendChild(img);
      a.append(title);
      cont.appendChild(a);
    }
  }

  cargarVideos().catch(() => {
    document.getElementById("videos").textContent = "No se pudieron cargar los videos.";
  });
</script>
</body>
</html>
