<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSVDDS0210</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b10;
    --panel: #15151d;
    --border: rgba(255, 255, 255, .08);
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --accent: #ff3b3b;
    --spotify: #1db954;
    --youtube: #ff0033;
    --guns: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Banner */
  .banner {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #3b0a0a, #0b0b10 70%);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  /* Sidebar */
  .sidebar { text-align: center; }
  .pfp {
    width: 176px;
    height: 176px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--bg);
    box-shadow: 0 0 0 2px var(--accent), 0 12px 30px rgba(0,0,0,.6);
    background: var(--panel);
    margin-top: -88px;
    position: relative;
  }
  .name {
    margin: 16px 0 6px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .bio-box {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px 18px;
    text-align: left;
  }
  .bio-box p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }

  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.07); }
  .btn svg, .btn img {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  /* Iconos de Simple Icons en blanco para verse bien sobre fondo oscuro */
  .btn img { filter: brightness(0) invert(1); }

  .btn-spotify:hover { border-color: var(--spotify); }
  .btn-spotify img { filter: none; } /* Spotify conserva su color */
  .btn-yt:hover { border-color: var(--youtube); }
  .btn-guns:hover { border-color: var(--guns); }
  .btn-guns svg { color: var(--guns); }

  /* Main */
  .main { min-width: 0; padding-top: 24px; }
  .section-title {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .albums {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 4px 2px 14px;
    scroll-snap-type: x mandatory;
  }
  .album {
    flex: 0 0 160px;
    text-decoration: none;
    color: var(--text);
    scroll-snap-align: start;
    transition: transform .2s ease;
  }
  .album:hover { transform: translateY(-4px); }
  .album img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    margin-bottom: 10px;
  }
  .album span {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .video-wrap {
    margin-top: 28px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }

  .spotify-embed {
    margin-top: 28px;
  }
  .spotify-embed iframe { border-radius: 12px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 16px; }
    .sidebar { max-width: 360px; width: 100%; margin: 0 auto; }
    .pfp { margin: -88px auto 0; display: block; }
    .main { padding-top: 0; }
  }
</style>
</head>
<body>

<img class="banner" src="assets/profile/banner.jpg" alt="">

<div class="layout">

  <aside class="sidebar">
    <img class="pfp" id="pfp" src="assets/profile/pfp.jpg" alt="">
    <h1 class="name" id="name"></h1>

    <div class="bio-box">
      <p id="bio"></p>

      <a class="btn btn-spotify" id="spotify" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/spotify.svg" alt="">
        Spotify
      </a>

      <a class="btn btn-yt" id="youtube" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/youtube.svg" alt="">
        YouTube
      </a>

      <a class="btn btn-guns" id="guns" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        Guns.lol
      </a>
    </div>
  </aside>

  <main class="main">
    <p class="section-title">Álbumes</p>
    <div id="albums" class="albums"></div>

    <div id="spotify-embed" class="spotify-embed"></div>

    <p class="section-title" style="margin-top:28px">Destacado</p>
    <div id="video" class="video-wrap"></div>
  </main>

</div>

<script src="assets/js/config.js"></script>
<script>
  const C = window.SITE;

  // Textos y enlaces
  document.title = C.artistName;
  document.getElementById("name").textContent = C.artistName;
  document.getElementById("bio").textContent = C.bio;
  document.getElementById("pfp").alt = C.artistName;
  document.querySelector(".banner").alt = C.artistName + " banner";

  document.getElementById("spotify").href = C.spotifyUrl;
  document.getElementById("youtube").href = C.youtubeUrl;
  document.getElementById("guns").href = C.gunsUrl;

  // Embed de Spotify
  if (C.spotifyEmbedUrl) {
    const embed = document.getElementById("spotify-embed");
    embed.innerHTML = `
      <iframe src="${C.spotifyEmbedUrl}" width="100%" height="352" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>`;
  }

  // Álbumes
  const albumsEl = document.getElementById("albums");
  for (const album of C.albums) {
    const a = document.createElement("a");
    a.className = "album";
    a.href = album.url;
    a.target = "_blank";
    a.rel = "noopener";

    const img = document.createElement("img");
    img.src = album.cover;
    img.alt = album.title;

    const label = document.createElement("span");
    label.textContent = album.title;

    a.append(img, label);
    albumsEl.appendChild(a);
  }

  // Video destacado
  const videoEl = document.getElementById("video");
  if (C.featuredVideoId && C.featuredVideoId !== "TU_VIDEO_ID") {
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube.com/embed/${C.featuredVideoId}`;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    videoEl.appendChild(iframe);
  } else {
    videoEl.innerHTML = '<div class="placeholder">Video destacado próximamente</div>';
  }
</script>

</body>
</html>
