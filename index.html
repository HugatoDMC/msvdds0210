<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSVDDS0210</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #15151d;
    --border: rgba(255, 255, 255, .14);
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --white: #ffffff;
    --spotify: #1db954;
    --youtube: #ff0033;
    --guns: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .banner {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, #1a1a24, #0b0b10 70%);
    border-bottom: 2px solid var(--white);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px 56px;
  }

  .sidebar { text-align: center; }
  .pfp {
    width: 176px;
    height: 176px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--white);
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
    background: var(--panel);
    margin-top: -88px;
    position: relative;
  }
  .name {
    margin: 16px 0 6px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: .08em;
  }
  .bio-box {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px 18px;
    text-align: left;
  }
  .bio-box p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }

  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.07); }
  .btn img, .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-spotify:hover { border-color: var(--spotify); }
  .btn-yt img { filter: brightness(0) invert(1); }
  .btn-yt:hover { border-color: var(--youtube); }
  .btn-guns svg { color: var(--guns); }
  .btn-guns:hover { border-color: var(--guns); }

  .main { min-width: 0; padding-top: 24px; }
  .section-title {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  .albums {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 4px 2px 14px;
  }
  .album {
    flex: 0 0 160px;
    text-decoration: none;
    color: var(--text);
    transition: transform .2s ease;
  }
  .album:hover { transform: translateY(-4px); }
  .album img {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    margin-bottom: 10px;
  }
  .album span {
    display: block;
    font-size: .9rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .spotify-embed { margin-top: 28px; }
  .spotify-embed iframe { border-radius: 12px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 16px; }
    .sidebar { max-width: 360px; width: 100%; margin: 0 auto; }
    .pfp { margin: -88px auto 0; display: block; }
    .main { padding-top: 0; }
  }
</style>
</head>
<body>

<img class="banner" src="assets/profile/banner.jpg" alt="Banner de MSVDDS0210">

<div class="layout">

  <aside class="sidebar">
    <img class="pfp" src="assets/profile/pfp.jpg" alt="MSVDDS0210">
    <h1 class="name">MSVDDS0210</h1>

    <div class="bio-box">
      <p>Yea...</p>

      <a class="btn btn-spotify" href="https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/spotify.svg" alt="">
        Spotify
      </a>

      <a class="btn btn-yt" href="https://www.youtube.com/channel/UCCwK9XKbU0bPLVUey64PcEA" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/youtube.svg" alt="">
        YouTube
      </a>

      <a class="btn btn-guns" href="https://guns.lol/TU_USUARIO" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        Guns.lol
      </a>
    </div>
  </aside>

  <main class="main">
    <p class="section-title">Álbumes</p>
    <div class="albums">
      <a class="album" href="https://open.spotify.com/album/5hkTPTOnpuj6gsDssA11iB" target="_blank" rel="noopener">
        <img src="assets/albums/Unexpected_optimism_PORT.png" alt="Unexpected Optimism">
        <span>Unexpected Optimism</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/2fWjp4PamyxCGsBqWQs8dc" target="_blank" rel="noopener">
        <img src="assets/albums/Weird_Feeling_PORT.png" alt="Weird Feeling">
        <span>Weird Feeling</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/6RNZGWoHdhyRA0vw8mNbbv" target="_blank" rel="noopener">
        <img src="assets/albums/Warm_Day_PORT.png" alt="Warm Day">
        <span>Warm Day</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/1IcxMRPBx1lngkgSdPGpZj" target="_blank" rel="noopener">
        <img src="assets/albums/Eye_Fish_Portt.png" alt="Eye Fish">
        <span>Eye Fish</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/48QchUrSc4xf4tR8i04rDD" target="_blank" rel="noopener">
        <img src="assets/albums/backseater_ost_port.png" alt="Backseater OST">
        <span>Backseater OST</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/6zEnCvqmo8ogNnYsbmdvJT" target="_blank" rel="noopener">
        <img src="assets/albums/Two_Sips_PORT.png" alt="Two Sips">
        <span>Two Sips</span>
      </a>
      <a class="album" href="https://open.spotify.com/album/3n45S4E8H61hZePTP3ThQj" target="_blank" rel="noopener">
        <img src="assets/albums/Due_Trust_PORT.png" alt="Due Trust">
        <span>Due Trust</span>
      </a>
    </div>

    <div class="spotify-embed">
      <p class="section-title">Escucha</p>
      <iframe src="https://open.spotify.com/embed/artist/0okmlAaeb1l5d1gqOeTsSJ?utm_source=generator"
        width="100%" height="352" frameborder="0" loading="lazy"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </main>

</div>

</body>
</html>
