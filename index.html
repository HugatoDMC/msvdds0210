<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSVDDS0210</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #000;
    color: #fff;
  }

  .banner {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
    border-bottom: 2px solid #ff3b3b;
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  /* Columna izquierda */
  .sidebar { text-align: center; }
  .pfp {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ff3b3b;
    background: #111;
    margin-top: -85px;   /* la foto se sale sobre el banner */
    position: relative;
  }
  .name { margin: 10px 0 16px; font-weight: 600; letter-spacing: 1px; }

  .bio-box {
    background: #3a3a3a;
    border-radius: 28px;
    padding: 20px 16px;
    text-align: left;
  }
  .bio-box p { margin: 0 0 14px; color: #fff; }
  .btn {
    display: block;
    text-align: center;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 2px solid;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  .btn-spotify { border-color: #1db954; color: #1db954; }
  .btn-yt { border-color: #ff3b3b; color: #ff3b3b; }
  .btn-guns { border-color: #a855f7; color: #a855f7; }

  /* Columna principal */
  .main { min-width: 0; padding-top: 20px; }

  .albums {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
  }
  .album {
    flex: 0 0 150px;
    text-decoration: none;
    color: #fff;
    font-size: .85rem;
  }
  .album img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border: 2px solid #ff3b3b;
    border-radius: 6px;
    display: block;
    margin-bottom: 6px;
  }

  .video {
    margin-top: 28px;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 2px solid #ff3b3b;
    border-radius: 10px;
    background: #111;
  }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .video-placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .pfp { margin: -85px auto 0; display: block; }
    .sidebar { max-width: 320px; margin: 0 auto; }
    .main { padding-top: 0; }
  }
</style>
</head>
<body>

<img class="banner" src="assets/profile/banner.jpg" alt="Banner de MSVDDS0210">

<div class="layout">

  <aside class="sidebar">
    <img class="pfp" src="assets/profile/pfp.jpg" alt="MSVDDS0210">
    <h1 class="name">MSVDDS0210</h1>

    <div class="bio-box">
      <p>Yea...</p>
      <a class="btn btn-spotify" href="https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" target="_blank" rel="noopener">Spotify</a>
      <a class="btn btn-yt" href="https://www.youtube.com/channel/UCCwK9XKbU0bPLVUey64PcEA" target="_blank" rel="noopener">YouTube</a>
      <a class="btn btn-guns" href="https://guns.lol/TU_USUARIO" target="_blank" rel="noopener">Guns.lol</a>
    </div>
  </aside>

  <main class="main">
    <div id="albums" class="albums"></div>

    <div class="video" id="video"></div>
  </main>

</div>

<script>
  // ===== Edita aquí =====

  // Álbumes: portada en assets/albums/ y enlace (Spotify, YouTube o donde quieras)
  const ALBUMS = [
    { title: "Nombre del álbum 1", cover: "assets/albums/album1.jpg", url: "https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" },
    { title: "Nombre del álbum 2", cover: "assets/albums/album2.jpg", url: "https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" },
    { title: "Nombre del álbum 3", cover: "assets/albums/album3.jpg", url: "https://open.spotify.com/artist/0okmlAaeb1l5d1gqOeTsSJ" }
  ];

  // Video grande: pon el ID del video de YouTube (lo que va después de "v=")
  const VIDEO_ID = "TU_VIDEO_ID";

  // ======================

  const albumsEl = document.getElementById("albums");
  for (const album of ALBUMS) {
    const a = document.createElement("a");
    a.className = "album";
    a.href = album.url;
    a.target = "_blank";
    a.rel = "noopener";

    const img = document.createElement("img");
    img.src = album.cover;
    img.alt = album.title;

    a.appendChild(img);
    a.append(album.title);
    albumsEl.appendChild(a);
  }

  const videoEl = document.getElementById("video");
  if (VIDEO_ID && VIDEO_ID !== "TU_VIDEO_ID") {
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube.com/embed/${VIDEO_ID}`;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    videoEl.appendChild(iframe);
  } else {
    videoEl.innerHTML = '<div class="video-placeholder">Pon el ID de un video en VIDEO_ID</div>';
  }
</script>

</body>
</html>
