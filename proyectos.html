<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos Destacados · Miyo Music ♪</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #15151d;
    --border: rgba(255, 255, 255, .14);
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== Barra superior con botón de volver ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, .85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1140px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.04);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: .9rem;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s ease; }
  .back:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.08); }
  .back:hover svg { transform: translateX(-3px); }
  .back:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .topbar .site { color: var(--muted); font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }

  /* ===== Encabezado ===== */
  .wrap { max-width: 1140px; margin: 0 auto; padding: 40px 24px 64px; }
  .head { text-align: center; margin-bottom: 36px; }
  .head h1 {
    margin: 0 0 8px;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: .08em;
    background: linear-gradient(90deg, #6b6b75 0%, #ffffff 25%, #6b6b75 50%, #ffffff 75%, #6b6b75 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: chroma 4s linear infinite;
  }
  @keyframes chroma { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
  @media (prefers-reduced-motion: reduce) { .head h1 { animation: none; } }
  .head p { margin: 0; color: var(--muted); }

  /* ===== Proyectos ===== */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; max-width: 880px; margin: 0 auto; }
  .project {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    color: var(--text);
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .project:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.6); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
  .project:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .project .thumb { aspect-ratio: 16 / 10; background: #0f0f15; overflow: hidden; }
  .project img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .project:hover img { transform: scale(1.04); }
  .project .info { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-top: 1px solid var(--border); }
  .project .name { font-weight: 800; letter-spacing: .1em; font-size: 1.05rem; }
  .project .go { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .5; transition: transform .15s ease, opacity .15s ease; }
  .project:hover .go { transform: translate(2px,-2px); opacity: .95; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      Volver
    </a>
    <span class="site">Miyo Music ♪</span>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>Proyectos Destacados</h1>
    <p>Algunos proyectos en los que he participado.</p>
  </div>

  <section class="projects" aria-label="Proyectos">
    <a class="project" href="http://em0x.itch.io/zipbomb" target="_blank" rel="noopener">
      <div class="thumb"><img src="https://img.itch.zone/aW1nLzI4NzczOTU0LnBuZw==/original/KkLVYc.png" alt="ZIPBOMB" loading="lazy"></div>
      <div class="info"><span class="name">ZIPBOMB</span><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
    </a>
    <a class="project" href="https://darcc.itch.io/backseater" target="_blank" rel="noopener">
      <div class="thumb"><img src="https://img.itch.zone/aW1nLzI2NDg0MDQwLnBuZw==/original/%2FvLMkd.png" alt="BACKSEATER" loading="lazy"></div>
      <div class="info"><span class="name">BACKSEATER</span><svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></div>
    </a>
  </section>
</main>

</body>
</html>
